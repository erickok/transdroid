<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transdroid · Filter drawer (M3 Expressive)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0" rel="stylesheet">
<style>
:root{
  --surface:#f8faf0;
  --surface-low:#f2f5ea;
  --surface-container:#eceee2;
  --surface-high:#e6e9dd;
  --surface-highest:#e0e3d7;
  --on-surface:#1a1c15;
  --on-surface-var:#44483b;
  --muted:#5c6053;
  --outline:#75796a;
  --outline-variant:#c5c8b8;
  --primary:#3f6a1e;
  --on-primary:#ffffff;
  --primary-container:#c0f39a;
  --on-primary-container:#0b2100;

  --sel-bg:#d8e8c9; --sel-fg:#2b3b1c;

  --dl:#3f68b8; --seed:#4d7d2a;

  /* label hues */
  --l-books:#c0871c; --l-music:#7a5bd0; --l-soft:#3f68b8; --l-video:#1f8f86;

  --shadow-drawer:2px 0 26px rgba(0,0,0,.30);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  font-family:"Roboto",system-ui,sans-serif;
  background:radial-gradient(120% 90% at 50% 0%, #2c3227 0%, #1a1e16 60%, #12140f 100%);
  min-height:100%; display:flex; align-items:center; justify-content:center; padding:32px 16px;
}
.msr{
  font-family:"Material Symbols Rounded"; font-weight:normal; font-style:normal; line-height:1;
  letter-spacing:normal; text-transform:none; white-space:nowrap; display:inline-block; direction:ltr;
  -webkit-font-smoothing:antialiased; font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24; user-select:none;
}
.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;}

.phone{
  width:390px; max-width:100%; height:820px; max-height:calc(100vh - 40px);
  background:#0c0d0a; border-radius:46px; padding:8px;
  box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.06);
}
.screen{
  position:relative; height:100%; width:100%; background:var(--surface); border-radius:39px;
  overflow:hidden; color:var(--on-surface); isolation:isolate;
}

/* scrim behind the modal drawer */
.scrim{position:absolute; inset:0; background:rgba(18,22,13,.44); z-index:1;}

/* modal navigation drawer */
.drawer{
  position:absolute; left:0; top:0; bottom:0; width:87%;
  background:var(--surface); z-index:2; border-radius:0 28px 28px 0;
  box-shadow:var(--shadow-drawer); display:flex; flex-direction:column; overflow:hidden;
}

.statusbar{
  height:34px; flex:none; display:flex; align-items:center; justify-content:space-between;
  padding:0 18px 0 26px; font-size:14px; font-weight:600; letter-spacing:.2px;
}
.statusbar .sys{display:flex; align-items:center; gap:7px;}
.statusbar .sys .msr{font-size:18px;}

/* header: app name + server selector */
.header{padding:6px 20px 2px;}
.brand{font-size:11px; font-weight:700; letter-spacing:1.6px; color:var(--muted); padding-left:4px;}
.server{
  margin-top:9px; display:flex; align-items:center; gap:13px; padding:9px 10px 9px 9px;
  border-radius:20px; background:var(--surface-container); cursor:pointer; transition:background .15s;
}
.server:hover{background:var(--surface-high);}
.server .avatar{width:42px; height:42px; border-radius:15px; background:var(--primary-container); color:var(--primary); display:grid; place-items:center; flex:none;}
.server .avatar .msr{font-size:23px;}
.server .meta{flex:1; min-width:0;}
.server .meta b{display:block; font-size:16px; font-weight:600; color:var(--on-surface); line-height:1.2;}
.server .meta small{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); margin-top:1px;}
.server .meta .sd{width:7px; height:7px; border-radius:50%; background:var(--seed);}
.server .chev{color:var(--muted); flex:none;}
.server .chev .msr{font-size:22px;}

/* text filter field */
.filter{
  margin:12px 16px 4px; height:50px; border-radius:25px; background:var(--surface-container);
  display:flex; align-items:center; gap:12px; padding:0 8px 0 16px; transition:background .15s;
}
.filter:focus-within{background:var(--surface-high); box-shadow:inset 0 0 0 2px var(--primary);}
.filter > .msr{font-size:22px; color:var(--muted); flex:none;}
.filter input{border:none; background:transparent; outline:none; flex:1; min-width:0; font-family:inherit; font-size:14.5px; color:var(--on-surface);}
.filter input::placeholder{color:var(--muted);}
.filter .clear{
  border:none; background:transparent; width:36px; height:36px; border-radius:50%; flex:none;
  display:none; place-items:center; cursor:pointer; color:var(--muted);
}
.filter .clear:hover{background:var(--surface-highest);}
.filter .clear .msr{font-size:20px;}

/* scroll region for the filter lists */
.scroll{flex:1; overflow-y:auto; padding-bottom:16px; scrollbar-width:none;}
.scroll::-webkit-scrollbar{display:none;}

.section-title{font-size:13px; font-weight:600; color:var(--on-surface-var); padding:16px 28px 6px;}

.item{
  display:flex; align-items:center; gap:14px; height:50px; padding:0 18px; margin:2px 12px;
  border-radius:25px; color:var(--on-surface-var); cursor:pointer; transition:background .12s;
}
.item:hover{background:var(--surface-high);}
.item.sel{background:var(--sel-bg); color:var(--sel-fg);}
.item .ic{width:24px; display:grid; place-items:center; flex:none;}
.item .ic .msr{font-size:22px;}
.item .lbl{flex:1; min-width:0; font-size:14.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.item.sel .lbl{font-weight:600;}
.item .count{font-size:12.5px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; flex:none;}
.item.sel .count{color:var(--sel-fg);}

/* label colour chips */
.tagdot{width:13px; height:13px; border-radius:5px; flex:none;}
.tagdot.books{background:var(--l-books);}
.tagdot.music{background:var(--l-music);}
.tagdot.soft{background:var(--l-soft);}
.tagdot.video{background:var(--l-video);}
.tagdot.none{background:transparent; box-shadow:inset 0 0 0 2px var(--outline-variant);}

.drawer-divider{height:1px; background:var(--outline-variant); opacity:.5; margin:10px 20px;}

.footer .item .ic .msr{color:var(--muted);}

.gesture{position:absolute; left:0; right:0; bottom:0; height:26px; display:grid; place-items:center; z-index:3;}
.gesture i{width:132px; height:5px; border-radius:3px; background:#000; opacity:.32;}
</style>
</head>
<body>
  <div class="phone"><div class="screen">

    <div class="scrim"></div>

    <aside class="drawer">
      <div class="statusbar">
        <span>4:52</span>
        <span class="sys">
          <span class="msr">network_wifi</span>
          <span class="msr">signal_cellular_alt</span>
          <span class="msr fill">battery_5_bar</span>
        </span>
      </div>

      <div class="header">
        <div class="brand">TRANSDROID</div>
        <div class="server">
          <div class="avatar"><span class="msr fill">dns</span></div>
          <div class="meta">
            <b>Xirvik</b>
            <small><span class="sd"></span> Connected · 14 torrents</small>
          </div>
          <span class="chev"><span class="msr">unfold_more</span></span>
        </div>
      </div>

      <div class="filter">
        <span class="msr">search</span>
        <input id="q" type="text" placeholder="Filter by name" aria-label="Filter torrents by name">
        <button class="clear" id="clear" aria-label="Clear filter"><span class="msr">close</span></button>
      </div>

      <div class="scroll">

        <div class="section-title">Status</div>
        <div class="group" data-group="status">
          <div class="item sel"><span class="ic"><span class="msr fill">list_alt</span></span><span class="lbl">All torrents</span><span class="count">14</span></div>
          <div class="item"><span class="ic"><span class="msr">download</span></span><span class="lbl">Downloading</span><span class="count">8</span></div>
          <div class="item"><span class="ic"><span class="msr">upload</span></span><span class="lbl">Seeding</span><span class="count">4</span></div>
          <div class="item"><span class="ic"><span class="msr">check_circle</span></span><span class="lbl">Completed</span><span class="count">5</span></div>
          <div class="item"><span class="ic"><span class="msr">pause</span></span><span class="lbl">Paused</span><span class="count">2</span></div>
        </div>

        <div class="drawer-divider"></div>

        <div class="section-title">Labels</div>
        <div class="group" data-group="labels">
          <div class="item"><span class="ic"><span class="tagdot books"></span></span><span class="lbl">Books</span><span class="count">3</span></div>
          <div class="item"><span class="ic"><span class="tagdot music"></span></span><span class="lbl">Music</span><span class="count">2</span></div>
          <div class="item"><span class="ic"><span class="tagdot soft"></span></span><span class="lbl">Software</span><span class="count">1</span></div>
          <div class="item"><span class="ic"><span class="tagdot video"></span></span><span class="lbl">Video</span><span class="count">4</span></div>
          <div class="item"><span class="ic"><span class="tagdot none"></span></span><span class="lbl">No label</span><span class="count">4</span></div>
        </div>

        <div class="drawer-divider"></div>

        <div class="footer">
          <div class="item"><span class="ic"><span class="msr">settings</span></span><span class="lbl">Settings</span></div>
        </div>

      </div>
    </aside>

    <div class="gesture"><i></i></div>

  </div></div>

<script>
// single-select within status, multi-select within labels
document.querySelectorAll('.group').forEach(group=>{
  const multi = group.dataset.group === 'labels';
  group.querySelectorAll('.item').forEach(it=>{
    it.addEventListener('click', ()=>{
      if (multi){ it.classList.toggle('sel'); }
      else { group.querySelectorAll('.item').forEach(x=>x.classList.remove('sel')); it.classList.add('sel'); }
    });
  });
});

// text filter clear button
const q = document.getElementById('q'), clear = document.getElementById('clear');
function sync(){ clear.style.display = q.value ? 'grid' : 'none'; }
q.addEventListener('input', sync);
clear.addEventListener('click', ()=>{ q.value=''; sync(); q.focus(); });
sync();
</script>
</body>
</html>
