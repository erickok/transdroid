<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transdroid · Changelog (M3 Expressive)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0" rel="stylesheet">
<style>
:root{
  --surface:#f8faf0;
  --surface-low:#f2f5ea;
  --surface-container:#eceee2;
  --surface-high:#e6e9dd;
  --surface-highest:#e0e3d7;
  --on-surface:#1a1c15;
  --on-surface-var:#44483b;
  --muted:#5c6053;
  --outline:#75796a;
  --outline-variant:#c5c8b8;
  --primary:#3f6a1e;
  --on-primary:#ffffff;
  --primary-container:#c0f39a;
  --on-primary-container:#0b2100;
  --dl:#3f68b8; --dl-track:#d3ddf2;
  --wait:#9a7b33; --wait-track:#e7ddc6;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  font-family:"Roboto",system-ui,sans-serif;
  background:radial-gradient(120% 90% at 50% 0%, #2c3227 0%, #1a1e16 60%, #12140f 100%);
  min-height:100%; display:flex; align-items:center; justify-content:center; padding:32px 16px;
}
.msr{
  font-family:"Material Symbols Rounded"; font-weight:normal; font-style:normal; line-height:1;
  letter-spacing:normal; text-transform:none; white-space:nowrap; display:inline-block; direction:ltr;
  -webkit-font-smoothing:antialiased; font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24; user-select:none;
}
.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;}

.phone{
  width:390px; max-width:100%; height:820px; max-height:calc(100vh - 40px);
  background:#0c0d0a; border-radius:46px; padding:8px;
  box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.06);
}
.screen{
  position:relative; height:100%; width:100%; background:var(--surface); border-radius:39px;
  overflow:hidden; display:flex; flex-direction:column; color:var(--on-surface); isolation:isolate;
}

.statusbar{
  height:34px; flex:none; display:flex; align-items:center; justify-content:space-between;
  padding:0 24px 0 28px; font-size:14px; font-weight:600; letter-spacing:.2px;
}
.statusbar .sys{display:flex; align-items:center; gap:7px;}
.statusbar .sys .msr{font-size:18px;}

.appbar{flex:none; height:56px; display:flex; align-items:center; gap:2px; padding:0 6px;}
.iconbtn{border:none; background:transparent; cursor:pointer; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:var(--on-surface-var); transition:background .15s;}
.iconbtn:hover{background:var(--surface-high);}
.iconbtn .msr{font-size:24px;}
.appbar h1{margin:0; font-size:20px; font-weight:600; padding-left:4px;}

.content{flex:1; overflow-y:auto; padding:4px 18px 32px; scrollbar-width:none;}
.content::-webkit-scrollbar{display:none;}

.rel{padding:16px 0 8px;}
.rel + .rel{border-top:1px solid var(--outline-variant);}
.rel-head{display:flex; align-items:center; gap:10px; padding:2px 2px 12px;}
.rel-head .rv{font-size:20px; font-weight:700; letter-spacing:0;}
.rel-head .rd{font-size:12.5px; font-weight:500; color:var(--muted);}
.rel-head .latest{margin-left:auto; font-size:11px; font-weight:700; letter-spacing:.3px; color:var(--on-primary-container); background:var(--primary-container); padding:3px 11px; border-radius:999px;}

.chg{display:flex; gap:12px; padding:7px 2px; align-items:flex-start;}
.tag{flex:none; font-size:10px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; padding:4px 0; border-radius:999px; margin-top:1px; width:70px; text-align:center;}
.tag.new{background:var(--primary-container); color:var(--on-primary-container);}
.tag.imp{background:var(--dl-track); color:var(--dl);}
.tag.fix{background:var(--wait-track); color:var(--wait);}
.ctext{font-size:14px; line-height:1.42; color:var(--on-surface); padding-top:2px;}

.gesture{flex:none; height:26px; display:grid; place-items:center;}
.gesture i{width:132px; height:5px; border-radius:3px; background:var(--on-surface); opacity:.35;}
</style>
</head>
<body>
  <div class="phone"><div class="screen">

    <div class="statusbar">
      <span>4:52</span>
      <span class="sys">
        <span class="msr">network_wifi</span>
        <span class="msr">signal_cellular_alt</span>
        <span class="msr fill">battery_5_bar</span>
      </span>
    </div>

    <header class="appbar">
      <button class="iconbtn" aria-label="Back"><span class="msr">arrow_back</span></button>
      <h1>What's new</h1>
    </header>

    <main class="content" id="content"></main>

    <div class="gesture"><i></i></div>

  </div></div>

<script>
const TAG = { new:'New', imp:'Improved', fix:'Fixed' };
const releases = [
  { v:'2.6.0', d:'March 2026', latest:true, changes:[
    ['new','Material 3 Expressive redesign across every screen'],
    ['new','Full dark theme and dynamic colour support'],
    ['new','Tablet dual-pane list-and-detail layout'],
    ['imp','Active downloads now show an animated wavy progress bar'],
    ['imp','Server setup detects host, port and SSL from a single URL'],
    ['fix','RSS items occasionally showed stale timestamps'],
  ]},
  { v:'2.5.1', d:'November 2025', changes:[
    ['imp','Faster Torznab search across multiple indexers'],
    ['fix','qBittorrent 5.x authentication failures'],
    ['fix','Crash when adding a torrent from a shared magnet link'],
  ]},
  { v:'2.5.0', d:'August 2025', changes:[
    ['new','Torznab indexer support in search'],
    ['new','Per-file priority controls in torrent details'],
    ['imp','Lower battery use during background polling'],
  ]},
  { v:'2.4.0', d:'April 2025', changes:[
    ['new','Label management and filtering'],
    ['fix','SCGI connections to rTorrent over TLS'],
  ]},
];

document.getElementById('content').innerHTML = releases.map(r=>`
  <div class="rel">
    <div class="rel-head">
      <span class="rv">${r.v}</span>
      <span class="rd">${r.d}</span>
      ${r.latest ? '<span class="latest">Latest</span>' : ''}
    </div>
    ${r.changes.map(([k,t])=>`
      <div class="chg"><span class="tag ${k}">${TAG[k]}</span><span class="ctext">${t}</span></div>
    `).join('')}
  </div>`).join('');
</script>
</body>
</html>
