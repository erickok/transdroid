<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transdroid · Add torrent (M3 Expressive)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0" rel="stylesheet">
<style>
:root{
  --surface:#f8faf0;
  --surface-low:#f2f5ea;
  --surface-container:#eceee2;
  --surface-high:#e6e9dd;
  --surface-highest:#e0e3d7;
  --field:#edf0e4;
  --on-surface:#1a1c15;
  --on-surface-var:#44483b;
  --muted:#5c6053;
  --outline:#75796a;
  --outline-variant:#c5c8b8;
  --primary:#3f6a1e;
  --on-primary:#ffffff;
  --primary-container:#c0f39a;
  --on-primary-container:#0b2100;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  font-family:"Roboto",system-ui,sans-serif;
  background:radial-gradient(120% 90% at 50% 0%, #2c3227 0%, #1a1e16 60%, #12140f 100%);
  min-height:100%; display:flex; align-items:center; justify-content:center; padding:32px 16px;
}
.msr{
  font-family:"Material Symbols Rounded"; font-weight:normal; font-style:normal; line-height:1;
  letter-spacing:normal; text-transform:none; white-space:nowrap; display:inline-block; direction:ltr;
  -webkit-font-smoothing:antialiased; font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24; user-select:none;
}
.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;}

.phone{
  width:390px; max-width:100%; height:820px; max-height:calc(100vh - 40px);
  background:#0c0d0a; border-radius:46px; padding:8px;
  box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.06);
}
.screen{
  position:relative; height:100%; width:100%; background:var(--surface); border-radius:39px;
  overflow:hidden; display:flex; flex-direction:column; color:var(--on-surface); isolation:isolate;
}

.statusbar{height:34px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 24px 0 28px; font-size:14px; font-weight:600; letter-spacing:.2px;}
.statusbar .sys{display:flex; align-items:center; gap:7px;}
.statusbar .sys .msr{font-size:18px;}

.appbar{flex:none; height:56px; display:flex; align-items:center; gap:2px; padding:0 6px;}
.iconbtn{border:none; background:transparent; cursor:pointer; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:var(--on-surface-var); transition:background .15s;}
.iconbtn:hover{background:var(--surface-high);}
.iconbtn .msr{font-size:24px;}
.appbar h1{margin:0; font-size:20px; font-weight:600; padding-left:4px;}

.content{flex:1; overflow-y:auto; padding:6px 16px 20px; scrollbar-width:none;}
.content::-webkit-scrollbar{display:none;}

/* magnet field */
.field{background:var(--field); border-radius:18px; padding:10px 14px 12px; border:1.5px solid transparent; transition:border-color .15s, background .15s;}
.field:focus-within{border-color:var(--primary); background:var(--surface-high);}
.flabel{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.flabel span{font-size:12px; font-weight:600; color:var(--muted);}
.field:focus-within .flabel span{color:var(--primary);}
.paste{border:none; background:transparent; cursor:pointer; font-family:inherit; font-size:13px; font-weight:600; color:var(--primary); display:inline-flex; align-items:center; gap:5px; padding:4px 8px; border-radius:999px;}
.paste:hover{background:var(--surface-highest);}
.paste .msr{font-size:17px;}
.frow{display:flex; gap:12px; align-items:flex-start; margin-top:4px;}
.frow .fic{font-size:20px; color:var(--muted); margin-top:7px; flex:none;}
.frow textarea{flex:1; min-width:0; border:none; background:transparent; outline:none; resize:none; font-family:inherit; font-size:15px; line-height:1.5; color:var(--on-surface); min-height:58px;}
.frow textarea::placeholder{color:var(--outline);}

/* or divider */
.ordiv{display:flex; align-items:center; gap:14px; margin:18px 4px;}
.ordiv::before,.ordiv::after{content:""; flex:1; height:1px; background:var(--outline-variant);}
.ordiv span{font-size:11.5px; font-weight:700; letter-spacing:.6px; color:var(--muted); text-transform:uppercase;}

/* choose file */
.btn-outline{width:100%; min-height:54px; padding:8px 16px; border:1.5px solid var(--outline-variant); border-radius:27px; background:transparent; color:var(--on-surface); font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:.12s;}
.btn-outline:hover{background:var(--surface-high);}
.btn-outline .msr{color:var(--primary); font-size:21px;}
.filechip{display:none; align-items:center; gap:10px; width:100%; min-height:54px; padding:8px 8px 8px 16px; border-radius:20px; background:var(--primary-container); color:var(--on-primary-container);}
.filechip.show{display:flex;}
.filechip .fn{flex:1; min-width:0; font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.filechip .fx{border:none; background:transparent; cursor:pointer; width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:var(--on-primary-container);}
.filechip .fx:hover{background:rgba(0,0,0,.08);}
.filechip .lead{font-size:21px;}

/* add paused switch */
.optrow{display:flex; align-items:flex-start; gap:14px; padding:15px 16px; background:var(--surface-container); border-radius:20px; margin-top:18px;}
.optrow .otext{flex:1; min-width:0;}
.optrow .otext b{display:block; font-size:15px; font-weight:600;}
.optrow .otext small{display:block; font-size:12.5px; color:var(--muted); line-height:1.42; margin-top:3px;}
.switch{position:relative; width:52px; height:32px; flex:none; margin-top:2px;}
.switch input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; z-index:2;}
.track{position:absolute; inset:0; border-radius:16px; background:var(--surface-highest); border:2px solid var(--outline); transition:.2s;}
.thumb{position:absolute; top:50%; left:8px; transform:translateY(-50%); width:16px; height:16px; border-radius:50%; background:var(--outline); transition:.2s cubic-bezier(.2,.8,.2,1);}
.switch input:checked ~ .track{background:var(--primary); border-color:var(--primary);}
.switch input:checked ~ .thumb{left:24px; width:24px; height:24px; background:var(--on-primary);}

/* docked add button */
.bottombar{flex:none; padding:12px 16px 14px; border-top:1px solid var(--outline-variant);}
.btn-add{width:100%; height:54px; border:none; border-radius:27px; background:var(--primary); color:var(--on-primary); font-family:inherit; font-size:16px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:.15s;}
.btn-add:not(:disabled):hover{filter:brightness(1.08);}
.btn-add:disabled{background:var(--surface-high); color:var(--muted); cursor:default;}

.gesture{flex:none; height:26px; display:grid; place-items:center;}
.gesture i{width:132px; height:5px; border-radius:3px; background:var(--on-surface); opacity:.35;}
</style>
</head>
<body>
  <div class="phone"><div class="screen">

    <div class="statusbar">
      <span>9:23</span>
      <span class="sys">
        <span class="msr">network_wifi</span>
        <span class="msr">signal_cellular_alt</span>
        <span class="msr fill">battery_5_bar</span>
      </span>
    </div>

    <header class="appbar">
      <button class="iconbtn" aria-label="Back"><span class="msr">arrow_back</span></button>
      <h1>Add torrent</h1>
    </header>

    <main class="content">
      <div class="field">
        <div class="flabel">
          <span>Magnet link or torrent URL</span>
          <button class="paste" id="paste"><span class="msr">content_paste</span>Paste</button>
        </div>
        <div class="frow">
          <span class="msr fic">link</span>
          <textarea id="magnet" rows="2" placeholder="magnet:?xt=… or https://…/file.torrent"></textarea>
        </div>
      </div>

      <div class="ordiv"><span>or</span></div>

      <button class="btn-outline" id="chooseBtn"><span class="msr">upload_file</span> Choose a .torrent file</button>
      <div class="filechip" id="fileChip">
        <span class="msr lead">description</span>
        <span class="fn" id="fileName"></span>
        <button class="fx" id="fileClear" aria-label="Remove file"><span class="msr">close</span></button>
      </div>
      <input type="file" id="fileInput" accept=".torrent" hidden>

      <div class="optrow">
        <div class="otext">
          <b>Add paused</b>
          <small>Adds it stopped so you can pick which files to download, then start it from the torrent's details.</small>
        </div>
        <label class="switch">
          <input type="checkbox" aria-label="Add paused">
          <span class="track"></span><span class="thumb"></span>
        </label>
      </div>
    </main>

    <div class="bottombar">
      <button class="btn-add" id="addBtn" disabled>Add to Xirvik</button>
    </div>

    <div class="gesture"><i></i></div>

  </div></div>

<script>
const magnet = document.getElementById('magnet');
const addBtn = document.getElementById('addBtn');
const fileInput = document.getElementById('fileInput');
const chooseBtn = document.getElementById('chooseBtn');
const fileChip = document.getElementById('fileChip');
const fileName = document.getElementById('fileName');
const fileClear = document.getElementById('fileClear');

let hasFile = false;
function refresh(){ addBtn.disabled = !(magnet.value.trim() || hasFile); }

magnet.addEventListener('input', refresh);

// Paste: pull from clipboard when allowed, otherwise drop in a sample magnet
document.getElementById('paste').addEventListener('click', async ()=>{
  let text = '';
  try { text = await navigator.clipboard.readText(); } catch(e){}
  if(!text) text = 'magnet:?xt=urn:btih:88594aaacbde40ef3e2510c47374ec0aa396c08e&dn=ubuntu-24.04.1-desktop-amd64.iso';
  magnet.value = text; refresh(); magnet.focus();
});

// choose .torrent file
chooseBtn.addEventListener('click', ()=> fileInput.click());
fileInput.addEventListener('change', ()=>{
  if(fileInput.files.length){
    hasFile = true;
    fileName.textContent = fileInput.files[0].name;
    chooseBtn.style.display = 'none';
    fileChip.classList.add('show');
    refresh();
  }
});
fileClear.addEventListener('click', ()=>{
  hasFile = false; fileInput.value = '';
  fileChip.classList.remove('show');
  chooseBtn.style.display = '';
  refresh();
});
</script>
</body>
</html>
