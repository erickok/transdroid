name: Create tag

# Manually creates a git tag at a given commit. Exists because some hosted
# environments can push branches but not tags; keeps tagging auditable via Actions.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to create"
        required: true
      sha:
        description: "Full commit SHA the tag should point at"
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create tag ref
        uses: actions/github-script@v9
        with:
          script: |
            const { tag, sha } = context.payload.inputs;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha,
            });
            core.info(`Created refs/tags/${tag} at ${sha}`);
