name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # By default only the repository's default branch saves the cache; development
          # happens on transdroid3, so save from there too, or every run starts cold
          cache-read-only: ${{ github.ref != 'refs/heads/transdroid3' && github.ref != 'refs/heads/master' }}

      - name: Protocol tests
        run: ./gradlew :protocol:test

      - name: App unit tests and lint
        run: ./gradlew :app:testFullDebugUnitTest :app:lintFullDebug

      - name: Assemble APKs
        run: ./gradlew :app:assembleFullDebug :app:assembleLiteDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: transdroid-full-debug
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
